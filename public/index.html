<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>99X Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Заставка -->
    <div id="splash-screen">
        <div class="splash-title" id="splash-text">Привет...</div>
    </div>

    <!-- Регистрация вне ТГ -->
    <div id="auth-block" style="display:none; text-align:center; padding: 50px 20px;">
        <h2>Ошибка доступа</h2>
        <p>Пожалуйста, войдите через официального Telegram бота.</p>
        <button class="ios-btn" onclick="window.location.href='https://t.me/your_bot'">Регистрация через Telegram</button>
    </div>

    <!-- Главный интерфейс -->
    <div id="main-app" style="display:none;">
        <header class="app-header">
            <div class="logo">99X</div>
            <div class="balance-badge"><span id="user-balance">0</span> ₽</div>
        </header>

        <!-- Вкладка: Игры -->
        <div id="tab-games" class="tab-content">
            <div class="games-grid">
                <div class="game-card">
                    <h3>🎲 DICE</h3>
                    <button class="ios-btn" onclick="openGame('dice')">Играть</button>
                </div>
                <div class="game-card">
                    <h3>🎡 Рулетка</h3>
                    <button class="ios-btn" onclick="openGame('roulette')">Играть</button>
                </div>
                <div class="game-card">
                    <h3>🎰 Слоты</h3>
                    <button class="ios-btn" onclick="openGame('slots')">Играть</button>
                </div>
                <div class="game-card">
                    <h3>⚽ Футбол</h3>
                    <button class="ios-btn" onclick="openGame('football')">Играть</button>
                </div>
            </div>
        </div>

        <!-- Окно Игр (Динамическое) -->
        <div id="game-modal" style="display:none; padding: 20px; text-align: center;">
            <h2 id="game-title">Игра</h2>
            <input type="number" id="bet-amount" class="chat-input" placeholder="Введите ставку" value="10">
            <div id="game-controls" style="margin-top: 15px;"></div>
            <button class="ios-btn" style="margin-top: 15px;" onclick="closeGame()">Назад в меню</button>
        </div>

        <!-- Вкладка: Профиль -->
        <div id="tab-profile" class="tab-content" style="display:none; padding: 20px;">
            <h3>Профиль</h3>
            <p>ID: <span id="prof-id"></span></p>
            <button class="ios-btn" onclick="depositStars()">Пополнить звездами ⭐ (1 ⭐ = 1 ₽)</button>
            <p style="margin-top:15px;">Пополнение рублями через админа: <a href="https://t.me/leymik" style="color:var(--neon-glow)">@leymik</a></p>

            <!-- Панель Администратора -->
            <div id="admin-panel" style="display:none; margin-top: 20px; border-top: 1px solid var(--glass-border); padding-top: 10px;">
                <h4 style="color: red;">Админ-Панель</h4>
                <input type="text" id="admin-target" class="chat-input" placeholder="ID или Username">
                <input type="number" id="admin-amount" class="chat-input" placeholder="Сумма" style="margin-top:5px;">
                <button class="ios-btn" onclick="adminAddBalance()" style="margin-top:5px;">Выдать баланс</button>
            </div>
        </div>

        <!-- Вкладка: Вывод -->
        <div id="tab-withdraw" class="tab-content" style="display:none; padding: 20px; text-align:center;">
            <h3>Вывод средств</h3>
            <p>Минимальная сумма вывода: <b>250 ₽</b></p>
            <input type="number" class="chat-input" placeholder="Сумма вывода">
            <button class="ios-btn" onclick="alert('Ошибка: Недостаточно средств или баланс не отыгран!')" style="margin-top: 10px;">Запросить вывод</button>
        </div>

        <!-- Общий чат -->
        <div class="chat-container">
            <div class="chat-messages" id="chat-box"></div>
            <div class="chat-input-zone">
                <input type="text" id="chat-msg" class="chat-input" placeholder="Сообщение...">
                <button class="ios-btn" onclick="sendChatMessage()">></button>
            </div>
        </div>

        <!-- Навигационное меню -->
        <nav class="bottom-nav">
            <button class="ios-btn" onclick="switchTab('profile')">Профиль</button>
            <button class="ios-btn" onclick="switchTab('games')">Игры</button>
            <button class="ios-btn" onclick="switchTab('withdraw')">Вывод</button>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
