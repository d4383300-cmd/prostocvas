<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Школьный Чат</title>
  <!-- Three.js для 3D графики -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; display: flex; height: 100vh; overflow: hidden; }
    
    #chat-container { flex: 1; display: flex; flex-direction: column; background: #1e1e1e; }
    #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { background: #2a2a2a; padding: 10px 15px; border-radius: 8px; max-width: 80%; word-break: break-word; }
    .msg .author { font-weight: bold; color: #00adb5; font-size: 0.85em; margin-bottom: 3px; }
    
    #input-area { padding: 15px; background: #252525; display: flex; gap: 10px; }
    input[type="text"] { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #3d3d3d; background: #181818; color: #fff; outline: none; }
    button { padding: 12px 20px; border: none; border-radius: 6px; background: #00adb5; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #008c9e; }

    /* Кнопка 3D Game */
    #btn-3d { background: #7289da; display: none; }
    #btn-3d:hover { background: #5b6eae; }

    /* Показываем кнопку только на ПК */
    @media (pointer: fine) and (min-width: 768px) {
      #btn-3d { display: inline-block; }
    }

    /* 3D Оверлей */
    #game-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; display: none; background: #000; }
    #canvas3d { width: 100%; height: 100%; display: block; }
    
    /* Игровой HUD */
    #game-hud { position: absolute; top: 20px; left: 20px; z-index: 10000; pointer-events: none; }
    .hud-box { background: rgba(0,0,0,0.7); padding: 12px 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); font-family: monospace; font-size: 14px; color: #00ffcc; margin-bottom: 10px; }
    
    #chat-input-hud { position: absolute; top: 20px; left: 20px; z-index: 10001; display: none; background: rgba(0,0,0,0.85); padding: 10px; border-radius: 8px; border: 2px solid #00adb5; width: 350px; }
    #chat-input-hud input { width: 100%; padding: 8px; background: #111; color: #fff; border: 1px solid #00adb5; border-radius: 4px; outline: none; font-size: 16px; }

    #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10000; }
    #exit-btn { position: absolute; top: 20px; right: 20px; z-index: 10000; background: #ff4757; }
  </style>
</head>
<body>

  <div id="chat-container">
    <div id="messages"></div>
    <div id="input-area">
      <input type="text" id="name-input" placeholder="Ваш ник..." style="width: 150px; flex: none;">
      <input type="text" id="msg-input" placeholder="Напишите сообщение...">
      <button onclick="sendChatMessage()">Отправить</button>
      <button id="btn-3d" onclick="enter3DGame()">3D GAME (ПК)</button>
    </div>
  </div>

  <!-- 3D Режим -->
  <div id="game-container">
    <div id="crosshair"></div>
    <div id="game-hud">
      <div class="hud-box">Кликните по экрану для захвата мыши<br>Нажмите [E] или [T] чтобы писать в чат<br>[ESC] - освободить мышь</div>
    </div>
    <div id="chat-input-hud">
      <input type="text" id="hud-msg-input" placeholder="Введите сообщение и нажмите Enter..." maxlength="80">
    </div>
    <button id="exit-btn" onclick="exit3DGame()">Выйти из 3D</button>
    <canvas id="canvas3d"></canvas>
  </div>

<script>
  let ws;
  let myNick = "Игрок_" + Math.floor(Math.random() * 899 + 100);
  document.getElementById('name-input').value = myNick;

  // Инициализация WebSocket
  function initWS() {
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${protocol}//${window.location.host}`);

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === 'chat') {
        addMessageToChat(data.nick, data.text);
        updateBoardText(data.nick, data.text);
      } else if (data.type === 'players_update') {
        updateRemotePlayers(data.players);
      } else if (data.type === 'seat_assigned') {
        mySeatIndex = data.seatIndex;
        positionCameraAtSeat(mySeatIndex);
      } else if (data.type === 'room_full') {
        alert("В классе нет свободных мест! (Максимум 8 игроков)");
        exit3DGame();
      }
    };
  }
  initWS();

  function addMessageToChat(nick, text) {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML = `<div class="author">${escapeHtml(nick)}</div>${escapeHtml(text)}`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function sendChatMessage(overrideText = null) {
    const nameInput = document.getElementById('name-input');
    const msgInput = document.getElementById('msg-input');
    
    myNick = nameInput.value.trim() || myNick;
    const text = overrideText || msgInput.value.trim();

    if (text && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'chat', nick: myNick, text: text }));
      if (!overrideText) msgInput.value = '';
    }
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // --- 3D ДВИЖОК THREE.JS ---
  let scene, camera, renderer;
  let isPointerLocked = false;
  let pitch = 0, yaw = 0;
  let mySeatIndex = -1;
  let playersMap = {}; // { id: mesh }
  let boardCanvas, boardCtx, boardTexture;

  const SEAT_POSITIONS = [
    { x: -2.5, z: -1.5 }, { x: 2.5, z: -1.5 },
    { x: -2.5, z:  1.5 }, { x: 2.5, z:  1.5 },
    { x: -2.5, z:  4.5 }, { x: 2.5, z:  4.5 },
    { x: -2.5, z:  7.5 }, { x: 2.5, z:  7.5 }
  ];

  function init3D() {
    const container = document.getElementById('game-container');
    const canvas = document.getElementById('canvas3d');

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    // Освещение
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(0, 10, 0);
    scene.add(dirLight);

    buildClassroom();

    // Захват мыши
    canvas.addEventListener('click', () => {
      if (!isChatHudOpen) canvas.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      isPointerLocked = (document.pointerLockElement === canvas);
    });

    document.addEventListener('mousemove', (e) => {
      if (!isPointerLocked) return;
      const sensitivity = 0.002;
      yaw -= e.movementX * sensitivity;
      pitch -= e.movementY * sensitivity;
      pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));

      camera.rotation.order = "YXZ";
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;

      // Отправляем поворот головы другим
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'rotate', yaw: yaw, pitch: pitch }));
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  }

  function buildClassroom() {
    // Стены и пол
    const roomGeo = new THREE.BoxGeometry(12, 6, 18);
    const roomMat = [
      new THREE.MeshBasicMaterial({ color: 0x3a3a3a, side: THREE.BackSide }), // Право
      new THREE.MeshBasicMaterial({ color: 0x3a3a3a, side: THREE.BackSide }), // Лево
      new THREE.MeshBasicMaterial({ color: 0x222222, side: THREE.BackSide }), // Потолок
      new THREE.MeshBasicMaterial({ color: 0x1f1a14, side: THREE.BackSide }), // Пол
      new THREE.MeshBasicMaterial({ color: 0x333333, side: THREE.BackSide }), // Задняя
      new THREE.MeshBasicMaterial({ color: 0x2b2b2b, side: THREE.BackSide }), // Передняя (где доска)
    ];
    const room = new THREE.Mesh(roomGeo, roomMat);
    room.position.set(0, 3, 3);
    scene.add(room);

    // Доска с сообщением
    boardCanvas = document.createElement('canvas');
    boardCanvas.width = 1024;
    boardCanvas.height = 512;
    boardCtx = boardCanvas.getContext('2d');
    
    boardTexture = new THREE.CanvasTexture(boardCanvas);
    updateBoardText("СИСТЕМА", "Добро пожаловать в 3D Класс!");

    const boardGeo = new THREE.PlaneGeometry(8, 3.5);
    const boardMat = new THREE.MeshBasicMaterial({ map: boardTexture });
    const board = new THREE.Mesh(boardGeo, boardMat);
    board.position.set(0, 3.5, -5.9);
    scene.add(board);

    // Парты и стулья (8 штук)
    SEAT_POSITIONS.forEach((pos) => {
      // Парта
      const deskGeo = new THREE.BoxGeometry(2, 1.2, 1);
      const deskMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
      const desk = new THREE.Mesh(deskGeo, deskMat);
      desk.position.set(pos.x, 0.6, pos.z - 0.4);
      scene.add(desk);

      // Стул
      const chairGeo = new THREE.BoxGeometry(1, 0.8, 0.8);
      const chairMat = new THREE.MeshLambertMaterial({ color: 0x4a2e18 });
      const chair = new THREE.Mesh(chairGeo, chairMat);
      chair.position.set(pos.x, 0.4, pos.z);
      scene.add(chair);
    });
  }

  // Обновление доски
  function updateBoardText(nick, text) {
    if (!boardCtx) return;
    boardCtx.fillStyle = '#0b2b18'; // Школьная доска
    boardCtx.fillRect(0, 0, 1024, 512);

    // Рамка доски
    boardCtx.strokeStyle = '#5c3a21';
    boardCtx.lineWidth = 20;
    boardCtx.strokeRect(0, 0, 1024, 512);

    // Текст
    boardCtx.fillStyle = '#ffffff';
    boardCtx.font = 'bold 36px monospace';
    boardCtx.fillText(`${nick}:`, 50, 100);

    boardCtx.font = '32px sans-serif';
    // Простой перенос слов
    const words = text.split(' ');
    let line = '';
    let y = 160;
    for (let n = 0; n < words.length; n++) {
      let testLine = line + words[n] + ' ';
      if (boardCtx.measureText(testLine).width > 900 && n > 0) {
        boardCtx.fillText(line, 50, y);
        line = words[n] + ' ';
        y += 45;
      } else {
        line = testLine;
      }
    }
    boardCtx.fillText(line, 50, y);

    boardTexture.needsUpdate = true;
  }

  // Создание ржачного скелета-человечка
  function createFunnyAvatar(nick) {
    const group = new THREE.Group();

    // Череп
    const headGeo = new THREE.SphereGeometry(0.35, 8, 8);
    const headMat = new THREE.MeshBasicMaterial({ color: 0xeeeeee, wireframe: true });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 1.3;
    group.add(head);

    // Ржачные глаза (сферы)
    const eyeGeo = new THREE.SphereGeometry(0.08, 6, 6);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
    leftEye.position.set(-0.12, 1.35, -0.28);
    const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
    rightEye.position.set(0.12, 1.35, -0.28);
    group.add(leftEye, rightEye);

    // Рот
    const mouthGeo = new THREE.BoxGeometry(0.2, 0.05, 0.05);
    const mouthMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const mouth = new THREE.Mesh(mouthGeo, mouthMat);
    mouth.position.set(0, 1.2, -0.3);
    group.add(mouth);

    // Скелет-позвоночник и тело
    const spineGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.8);
    const boneMat = new THREE.MeshBasicMaterial({ color: 0xcccccc });
    const spine = new THREE.Mesh(spineGeo, boneMat);
    spine.position.y = 0.7;
    group.add(spine);

    // Руки на парте
    const armGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.6);
    const leftArm = new THREE.Mesh(armGeo, boneMat);
    leftArm.position.set(-0.3, 0.7, -0.2);
    leftArm.rotation.x = Math.PI / 3;
    const rightArm = new THREE.Mesh(armGeo, boneMat);
    rightArm.position.set(0.3, 0.7, -0.2);
    rightArm.rotation.x = Math.PI / 3;
    group.add(leftArm, rightArm);

    return group;
  }

  function updateRemotePlayers(players) {
    // Удаляем ушедших
    Object.keys(playersMap).forEach(id => {
      if (!players[id]) {
        scene.remove(playersMap[id]);
        delete playersMap[id];
      }
    });

    // Обновляем или добавляем новых
    Object.keys(players).forEach(id => {
      if (id === ws.id) return; // Пропускаем себя

      const pData = players[id];
      if (!playersMap[id]) {
        const avatar = createFunnyAvatar(pData.nick);
        const pos = SEAT_POSITIONS[pData.seatIndex];
        avatar.position.set(pos.x, 0, pos.z);
        scene.add(avatar);
        playersMap[id] = avatar;
      }

      // Поворот головы
      const avatar = playersMap[id];
      avatar.children[0].rotation.y = pData.yaw || 0;
      avatar.children[0].rotation.x = pData.pitch || 0;
    });
  }

  function positionCameraAtSeat(seatIndex) {
    if (seatIndex < 0 || seatIndex >= SEAT_POSITIONS.length) return;
    const pos = SEAT_POSITIONS[seatIndex];
    camera.position.set(pos.x, 1.3, pos.z); // Высота глаз за партой
  }

  // Вход/Выход из 3D
  function enter3DGame() {
    myNick = document.getElementById('name-input').value.trim() || myNick;
    document.getElementById('game-container').style.display = 'block';
    
    if (!scene) init3D();

    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'join_3d', nick: myNick }));
    }
  }

  function exit3DGame() {
    document.getElementById('game-container').style.display = 'none';
    if (document.pointerLockElement) document.exitPointerLock();
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'leave_3d' }));
    }
  }

  // --- Управление Чатом в 3D (E / T) ---
  let isChatHudOpen = false;
  const chatHud = document.getElementById('chat-input-hud');
  const hudInput = document.getElementById('hud-msg-input');

  document.addEventListener('keydown', (e) => {
    if (document.getElementById('game-container').style.display !== 'block') return;

    // Клавиши E (Eng) / Т (Рус) или T (Eng) / Е (Рус)
    const key = e.key.toLowerCase();
    if (!isChatHudOpen && (key === 'e' || key === 't' || key === 'у' || key === 'е')) {
      e.preventDefault();
      openHudChat();
    } else if (isChatHudOpen && e.key === 'Enter') {
      const txt = hudInput.value.trim();
      if (txt) sendChatMessage(txt);
      closeHudChat();
    } else if (isChatHudOpen && e.key === 'Escape') {
      closeHudChat();
    }
  });

  function openHudChat() {
    isChatHudOpen = true;
    chatHud.style.display = 'block';
    hudInput.value = '';
    hudInput.focus();
    if (document.pointerLockElement) document.exitPointerLock();
  }

  function closeHudChat() {
    isChatHudOpen = false;
    chatHud.style.display = 'none';
    document.getElementById('canvas3d').requestPointerLock();
  }

  // Функция создания скриншота с камеры наблюдения
  window.captureSecurityCamera = function() {
    if (!renderer || !scene) return null;

    // Сохраняем позицию активной камеры
    const origPos = camera.position.clone();
    const origRot = camera.rotation.clone();

    // Перемещаем камеру в угол تحت потолок (Ракурс камеры наблюдения)
    camera.position.set(5.5, 5.5, -5.5);
    camera.lookAt(0, 1, 2);

    renderer.render(scene, camera);
    const dataURL = renderer.domElement.toDataURL('image/jpeg', 0.6);

    // Возвращаем камеру назад
    camera.position.copy(origPos);
    camera.rotation.copy(origRot);

    return dataURL;
  };

  function animate() {
    requestAnimationFrame(animate);
    if (renderer && scene && camera) {
      renderer.render(scene, camera);
    }
  }
</script>
</body>
</html>
