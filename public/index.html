<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Кинотеатр</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #css3d, #webgl { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #css3d { pointer-events: none; }
        #hint { position: fixed; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 6px; font-size: 11px; z-index: 10; }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="hint">🍿 3D Кинотеатр | Зал со ступенями и 12 местами</div>
    <div id="webgl"></div>
    <div id="css3d"></div>
    <script src="app.js"></script>
</body>
</html>
