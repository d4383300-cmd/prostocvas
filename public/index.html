<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Быстрее закрой дверь!</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; background: #000; }
    #canvas-container { width: 100vw; height: 100vh; }
    
    /* UI overlays */
    #ui { position: absolute; top: 10px; left: 10px; color: #fff; text-shadow: 1px 1px 3px #000; pointer-events: none; }
    #interact-btn { position: absolute; bottom: 80px; right: 20px; width: 80px; height: 80px; background: rgba(255,255,255,0.3); border: 2px solid #fff; border-radius: 50%; color: white; font-weight: bold; display: none; align-items: center; justify-content: center; }
    
    /* Mobile Controls */
    #touch-zone { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px dashed rgba(255,255,255,0.4); display: none; }
    #stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.5); border-radius: 50%; }

    /* Chat UI */
    #chat-box { position: absolute; bottom: 10px; left: 10px; width: 280px; pointer-events: auto; }
    #chat-input { width: 70%; padding: 8px; border: none; border-radius: 4px; outline: none; }
    #chat-btn { width: 25%; padding: 8px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; }
    
    /* Roblox-like speech bubbles */
    .bubble { position: absolute; background: rgba(255, 255, 255, 0.9); color: #000; padding: 6px 10px; border-radius: 10px; font-size: 12px; font-weight: bold; pointer-events: none; transform: translate(-50%, -100%); white-space: nowrap; border: 1px solid #000; display: none; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui">
    <h2 id="timer-display">ПОДГОТОВКА: 60s</h2>
    <p id="status-display">Осмотритесь и прочтите правила на мониторе!</p>
  </div>

  <div id="interact-btn">E / НАЖАТЬ</div>

  <div id="touch-zone"><div id="stick"></div></div>

  <div id="chat-box">
    <input type="text" id="chat-input" placeholder="Написать в чат (Enter)..." maxlength="40">
    <button id="chat-btn">Отправить</button>
  </div>

  <div id="bubble-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
