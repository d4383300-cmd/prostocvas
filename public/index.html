<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Онлайн Кинотеатр</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        /* Модальное окно ввода ссылки */
        #urlModal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.9);
            padding: 20px; border-radius: 12px; border: 1px solid #ff0055;
            z-index: 100; text-align: center; color: white; width: 80%; max-width: 400px;
        }
        #urlInput {
            width: 90%; padding: 10px; margin: 10px 0; border-radius: 6px;
            border: 1px solid #444; background: #222; color: white; outline: none;
        }
        #btnSubmit {
            padding: 10px 20px; background: #ff0055; color: white;
            border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
        }

        /* Кнопка смены видео для мобилок */
        #mobileUrlBtn {
            position: fixed; top: 15px; right: 15px; z-index: 90;
            background: rgba(255, 0, 85, 0.8); color: white; border: none;
            padding: 10px 15px; border-radius: 8px; font-weight: bold;
        }

        /* Виртуальный джойстик на мобильном */
        #joystickZone {
            position: fixed; bottom: 20px; left: 20px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.1); border-radius: 60px;
            z-index: 90; display: none; touch-action: none; border: 1px solid rgba(255,255,255,0.2);
        }
        #joystickKnob {
            width: 50px; height: 50px; background: rgba(255, 0, 85, 0.8);
            border-radius: 25px; position: absolute; top: 35px; left: 35px;
        }
    </style>
    <!-- Подключение Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Three.js & Socket.io -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <button id="mobileUrlBtn" onclick="toggleUrlModal()">Вставить видео (Т)</button>

    <div id="urlModal">
        <h3>Вставьте ссылку на Direct MP4/WebM</h3>
        <input type="text" id="urlInput" placeholder="https://site.com/video.mp4">
        <br>
        <button id="btnSubmit" onclick="submitUrl()">Запустить видео</button>
    </div>

    <div id="joystickZone"><div id="joystickKnob"></div></div>
    <div id="canvas-container"></div>

    <script src="app.js"></script>
</body>
</html>
