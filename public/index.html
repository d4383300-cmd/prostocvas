<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Кинотеатр — 6 мест</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        
        #css3d, #webgl {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }
        #css3d { pointer-events: none; }

        #crosshair {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 6px; height: 6px; background: rgba(255, 255, 255, 0.8);
            border-radius: 50%; pointer-events: none; z-index: 10;
        }

        #hint {
            position: fixed; top: 10px; left: 10px; color: #fff;
            background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 6px;
            pointer-events: none; font-size: 11px; z-index: 10; border: 1px solid #333;
        }

        #fullOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95); color: #ff0055; z-index: 200;
            align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold; text-align: center; padding: 20px;
        }

        #videoModal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: #141416;
            padding: 16px; border-radius: 10px; border: 1px solid #ff0055;
            z-index: 100; text-align: center; color: white; width: 90%; max-width: 360px;
        }
        #videoModal input {
            width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px;
            border: 1px solid #333; background: #08080a; color: #fff; outline: none; font-size: 12px;
        }
        #videoModal button {
            padding: 8px 18px; background: #ff0055; color: white;
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
        }

        #chatContainer {
            position: fixed; bottom: 20px; left: 20px; width: 240px;
            z-index: 50; pointer-events: none;
        }
        #chatHistory {
            height: 100px; overflow-y: auto; display: flex; flex-direction: column;
            gap: 4px; margin-bottom: 6px;
        }
        .chat-msg {
            background: rgba(0, 0, 0, 0.7); padding: 4px 8px; border-radius: 4px;
            color: #fff; font-size: 11px; width: fit-content; max-width: 100%;
            word-break: break-word;
        }
        .chat-msg b { color: #ff3366; }
        
        #chatInputContainer {
            display: none; width: 100%; pointer-events: auto; flex-direction: row; gap: 4px;
        }
        #chatInput {
            flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #444;
            background: rgba(0, 0, 0, 0.9); color: #fff; outline: none; font-size: 13px;
        }
        #chatSendBtn {
            padding: 0 12px; background: #ff0055; color: white; border: none;
            border-radius: 4px; font-weight: bold; cursor: pointer;
        }

        .mobile-btn {
            position: fixed; z-index: 40; background: rgba(255,0,85,0.7); color: white;
            border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 18px;
            display: flex; align-items: center; justify-content: center;
        }
        #btnChat { bottom: 20px; right: 20px; }
        #btnVideo { bottom: 80px; right: 20px; }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="hint">
        🖱️ <b>Поворот камеры:</b> Кликните или свайпайте | 💬 <b>Enter / Кнопка</b> — Чат | 🎬 <b>T / Кнопка</b> — Видео (введите "стрим")
    </div>

    <div id="fullOverlay">НЕТ СВОБОДНЫХ МЕСТ В ЗАЛЕ</div>

    <div id="videoModal">
        <h4 style="margin: 0 0 8px 0;">Вставить ссылку или "стрим"</h4>
        <input type="text" id="videoUrlInput" placeholder="Ссылка на YouTube / 'стрим'">
        <button onclick="submitVideoUrl()">Запустить</button>
    </div>

    <div id="chatContainer">
        <div id="chatHistory"></div>
        <div id="chatInputContainer">
            <input type="text" id="chatInput" placeholder="Сообщение..." maxlength="80">
            <button id="chatSendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <button class="mobile-btn" id="btnChat">💬</button>
    <button class="mobile-btn" id="btnVideo">🎬</button>

    <div id="webgl"></div>
    <div id="css3d"></div>

    <script src="app.js"></script>
</body>
</html>
