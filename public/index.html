<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Smart Home HD</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; }

        /* Прицел от 1-го лица */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px; background: rgba(255,255,255,0.8);
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; border: 1px solid #000;
        }

        /* Подсказка управления */
        #ui-hint {
            position: absolute; bottom: 20px; left: 20px;
            color: #fff; background: rgba(0,0,0,0.6); padding: 12px 20px;
            border-radius: 8px; font-size: 14px; backdrop-filter: blur(5px);
        }

        /* Инвентарь */
        #inventory {
            position: absolute; bottom: 20px; right: 20px;
            display: flex; gap: 10px; background: rgba(0,0,0,0.6);
            padding: 8px; border-radius: 8px; backdrop-filter: blur(5px);
        }
        .slot {
            width: 48px; height: 48px; background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3); border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; cursor: pointer; transition: 0.2s;
        }
        .slot:hover { border-color: #00ff88; background: rgba(0,255,136,0.2); }

        /* Модальные окна */
        .modal {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: #1a1a1a; color: #fff;
            padding: 25px; border-radius: 12px; border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; z-index: 100; min-width: 300px;
        }
        .modal input {
            width: 90%; padding: 10px; margin: 15px 0; border-radius: 6px;
            border: 1px solid #444; background: #222; color: #fff; outline: none;
        }
        .modal button {
            padding: 10px 20px; border: none; background: #0088ff; color: #fff;
            border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px;
        }
        .modal button:hover { background: #0066cc; }

        /* Мобильное управление */
        #mobile-controls {
            position: absolute; bottom: 30px; left: 30px; display: none; grid-template-columns: repeat(3, 50px); gap: 5px;
        }
        .m-btn {
            width: 50px; height: 50px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
            border-radius: 8px; color: white; font-size: 18px; font-weight: bold; display: flex; align-items: center; justify-content: center;
        }
        @media (max-width: 768px) { #mobile-controls { display: grid; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>

    <div id="ui-hint">
        <b>Управление:</b> WASD — Ходьба | Мышь — Обзор (Клик для захвата)<br>
        <b>E</b> — Взаимодействие с объектами
    </div>

    <!-- Инвентарь -->
    <div id="inventory">
        <div class="slot" id="slot-1" onclick="useItem('🍏')">🍏</div>
        <div class="slot" id="slot-2" onclick="useItem('🍕')">🍕</div>
        <div class="slot" id="slot-3" onclick="useItem('🥤')">🥤</div>
    </div>

    <!-- Модалка Телевизора -->
    <div id="tv-modal" class="modal">
        <h3>📺 Видео-Центр в Зале</h3>
        <p>Вставьте прямой URL на видео (.mp4 / WebM):</p>
        <input type="text" id="video-url" placeholder="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4">
        <br>
        <button onclick="applyVideo()">Запустить на ТВ</button>
        <button onclick="closeModal('tv-modal')" style="background:#555;">Закрыть</button>
    </div>

    <!-- Модалка Казино -->
    <div id="casino-modal" class="modal">
        <h3>🎰 Казино 777</h3>
        <div id="slots-display" style="font-size: 48px; margin: 20px; background: #000; padding: 10px; border-radius: 8px;">7️⃣ | 7️⃣ | 7️⃣</div>
        <button onclick="playSlots()" style="background: #ff9900;">Крутить (10$)</button>
        <button onclick="closeModal('casino-modal')" style="background:#555;">Выйти</button>
    </div>

    <!-- Мобильные кнопки -->
    <div id="mobile-controls">
        <div></div><div class="m-btn" ontouchstart="keys.w=true" ontouchend="keys.w=false">▲</div><div></div>
        <div class="m-btn" ontouchstart="keys.a=true" ontouchend="keys.a=false">◀</div>
        <div class="m-btn" ontouchstart="keys.s=true" ontouchend="keys.s=false">▼</div>
        <div class="m-btn" ontouchstart="keys.d=true" ontouchend="keys.d=false">▶</div>
    </div>

    <!-- HTML5 Video Element, который транслируется в 3D текстуру ТВ -->
    <video id="tv-video-element" loop crossOrigin="anonymous" style="display:none;"></video>

    <script>
        const socket = io();
        let scene, camera, renderer;
        let myPlayerMesh, selfId;
        const otherPlayers = {};
        const keys = { w: false, a: false, s: false, d: false };

        // Настройки 1-го лица
        let yaw = 0, pitch = 0;
        const moveSpeed = 0.12;

        // Видео-текстура для ТВ
        let tvVideoElement, tvVideoTexture;

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a24);
            scene.fog = new THREE.FogExp2(0x1a1a24, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.7, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Освещение HD
            const ambient = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambient);

            const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
            mainLight.position.set(10, 20, 15);
            mainLight.castShadow = true;
            scene.add(mainLight);

            // ТВ Элемент
            tvVideoElement = document.getElementById('tv-video-element');
            tvVideoTexture = new THREE.VideoTexture(tvVideoElement);

            setupControls();
            buildDetailedHouse();
            animate();
        }

        // Захватом мыши для 1-го лица
        function setupControls() {
            document.body.addEventListener('click', () => {
                if(document.pointerLockElement !== document.body) {
                    document.body.requestPointerLock();
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    yaw -= e.movementX * 0.002;
                    pitch -= e.movementY * 0.002;
                    pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch));
                }
            });

            window.addEventListener('keydown', (e) => {
                if(e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true;
                if(e.key.toLowerCase() === 'e') checkInteractions();
            });
            window.addEventListener('keyup', (e) => {
                if(e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false;
            });
        }

        // Постройка Дома с детальной мебелью и текстурами
        function buildDetailedHouse() {
            // Текстурированные материалы
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xecefef, roughness: 0.8 });
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x3e2723, roughness: 0.4 }); // Деревянный паркет
            const ceilingMat = new THREE.MeshStandardMaterial({ color: 0xffffff });

            // Пол и Потолок
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), ceilingMat);
            ceiling.position.y = 4;
            ceiling.rotation.x = Math.PI / 2;
            scene.add(ceiling);

            // Стены
            function createWall(x, z, w, h, d, color=0xecefef) {
                const mat = color === 0xecefef ? wallMat : new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
                const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
                wall.position.set(x, h/2, z);
                wall.castShadow = true;
                wall.receiveShadow = true;
                scene.add(wall);
            }

            // Внешний контур
            createWall(0, -15, 30, 4, 0.5);
            createWall(0, 15, 30, 4, 0.5);
            createWall(-15, 0, 0.5, 4, 30);
            createWall(15, 0, 0.5, 4, 30);

            // Перегородки (Комнаты БЕЗ дверей — просторные проходы)
            createWall(-5, -7.5, 0.4, 4, 15);
            createWall(5, 7.5, 0.4, 4, 15);

            // 1. ЗАЛ (Центр): Диван и ТВ
            const tvFrameMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8 });
            const tvScreenMat = new THREE.MeshBasicMaterial({ map: tvVideoTexture });

            const tvFrame = new THREE.Mesh(new THREE.BoxGeometry(6, 3.5, 0.2), tvFrameMat);
            tvFrame.position.set(0, 2.2, -14.6);
            scene.add(tvFrame);

            const tvScreen = new THREE.Mesh(new THREE.PlaneGeometry(5.6, 3.1), tvScreenMat);
            tvScreen.position.set(0, 2.2, -14.48);
            scene.add(tvScreen);

            // Диван
            const sofaMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
            const sofaBase = new THREE.Mesh(new THREE.BoxGeometry(6, 0.8, 2), sofaMat);
            sofaBase.position.set(0, 0.4, -8);
            scene.add(sofaBase);

            // 2. КУХНЯ (Слева): Холодильник и Стол
            const fridgeMat = new THREE.MeshStandardMaterial({ color: 0xdcdde1, metalness: 0.5, roughness: 0.3 });
            const fridge = new THREE.Mesh(new THREE.BoxGeometry(2, 3.8, 2), fridgeMat);
            fridge.position.set(-13, 1.9, -13);
            scene.add(fridge);

            // 3. КОМНАТА 1 (Справа): Казино-слоты
            const slotBodyMat = new THREE.MeshStandardMaterial({ color: 0x8e44ad, metalness: 0.3 });
            const slotMachine = new THREE.Mesh(new THREE.BoxGeometry(2.5, 3.5, 2), slotBodyMat);
            slotMachine.position.set(12, 1.75, 12);
            scene.add(slotMachine);

            // 4. КОМНАТА 2 (Декор): Картина и Точечный свет
            const frameMat = new THREE.MeshStandardMaterial({ color: 0xd4af37 });
            const picture = new THREE.Mesh(new THREE.BoxGeometry(0.1, 3, 4), frameMat);
            picture.position.set(-14.7, 2.2, 8);
            scene.add(picture);

            // Точечные светильники в комнатах
            const light1 = new THREE.PointLight(0xffea00, 0.8, 12);
            light1.position.set(-10, 3.5, -10);
            scene.add(light1);

            const light2 = new THREE.PointLight(0x00a8ff, 0.8, 12);
            light2.position.set(10, 3.5, 10);
            scene.add(light2);
        }

        // Создание детальной 3D-модели других игроков
        function createPlayerMesh(skinColor, shirtColor) {
            const group = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: skinColor });
            const shirtMat = new THREE.MeshStandardMaterial({ color: shirtColor });

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), skinMat);
            head.position.y = 1.5;
            group.add(head);

            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.25, 0.9, 16), shirtMat);
            body.position.y = 0.85;
            group.add(body);

            return group;
        }

        // Сетевая синхронизация
        socket.on('currentPlayers', (data) => {
            selfId = data.selfId;
            Object.keys(data.players).forEach((id) => {
                if(id !== selfId) {
                    const p = data.players[id];
                    const mesh = createPlayerMesh(p.skinColor, p.shirtColor);
                    mesh.position.set(p.x, p.y, p.z);
                    scene.add(mesh);
                    otherPlayers[id] = mesh;
                }
            });
        });

        socket.on('newPlayer', (p) => {
            const mesh = createPlayerMesh(p.skinColor, p.shirtColor);
            mesh.position.set(p.x, p.y, p.z);
            scene.add(mesh);
            otherPlayers[p.id] = mesh;
        });

        socket.on('playerMoved', (p) => {
            if (otherPlayers[p.id]) {
                otherPlayers[p.id].position.set(p.x, p.y, p.z);
                otherPlayers[p.id].rotation.y = p.rotationY;
            }
        });

        socket.on('playerDisconnected', (id) => {
            if (otherPlayers[id]) {
                scene.remove(otherPlayers[id]);
                delete otherPlayers[id];
            }
        });

        socket.on('updateTvVideo', (url) => {
            tvVideoElement.src = url;
            tvVideoElement.play().catch(e => console.log("Автовоспроизведение заблокировано браузером:", e));
        });

        // Перемещение от первого лица
        function updateMovement() {
            camera.rotation.order = "YXZ";
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            const dir = new THREE.Vector3();
            if (keys.w) dir.z -= 1;
            if (keys.s) dir.z += 1;
            if (keys.a) dir.x -= 1;
            if (keys.d) dir.x += 1;

            dir.normalize();
            dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            camera.position.addScaledVector(dir, moveSpeed);

            // Ограничения стен
            camera.position.x = Math.max(-14, Math.min(14, camera.position.x));
            camera.position.z = Math.max(-14, Math.min(14, camera.position.z));
            camera.position.y = 1.7; // Высота глаз

            if(keys.w || keys.s || keys.a || keys.d) {
                socket.emit('playerMove', {
                    x: camera.position.x,
                    y: camera.position.y,
                    z: camera.position.z,
                    rotationY: yaw
                });
            }
        }

        // Интерактив (клавиша E)
        function checkInteractions() {
            const pos = camera.position;

            // Телевизор в Зале
            if(Math.hypot(pos.x - 0, pos.z - (-14)) < 4) {
                document.getElementById('tv-modal').style.display = 'block';
                document.exitPointerLock();
            }
            // Холодильник
            else if(Math.hypot(pos.x - (-13), pos.z - (-13)) < 3) {
                alert("❄️ Вы открыли холодильник и взяли свежую еду!");
            }
            // Казино
            else if(Math.hypot(pos.x - 12, pos.z - 12) < 3) {
                document.getElementById('casino-modal').style.display = 'block';
                document.exitPointerLock();
            }
        }

        // Модалки
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function applyVideo() {
            const url = document.getElementById('video-url').value;
            if(url) {
                socket.emit('syncTvVideo', url);
                closeModal('tv-modal');
            }
        }

        function playSlots() {
            const items = ['7️⃣', '💎', '🍒', '🍋', '🔔'];
            const a = items[Math.floor(Math.random() * items.length)];
            const b = items[Math.floor(Math.random() * items.length)];
            const c = items[Math.floor(Math.random() * items.length)];
            document.getElementById('slots-display').innerText = `${a} | ${b} | ${c}`;
            if(a === b && b === c) alert("🎉 ВЫИГРЫШ!");
        }

        function useItem(emoji) {
            alert(`Вы применили: ${emoji}`);
        }

        function animate() {
            requestAnimationFrame(animate);
            updateMovement();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
