<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Oldschool Office Chat</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
    #canvas-container { width: 100vw; height: 100vh; }
    #ui { position: absolute; top: 10px; left: 10px; color: #0f0; z-index: 10; pointer-events: none; }
    #input-box {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: none; background: rgba(0,0,0,0.8); padding: 10px; border: 2px solid #0f0;
    }
    input, button { background: #111; color: #0f0; border: 1px solid #0f0; padding: 8px; }
    .btn-action { position: absolute; right: 20px; padding: 15px; background: #222; color: #fff; border: 2px solid #fff; border-radius: 8px; }
    #smoke-btn { bottom: 80px; }
    #selfie-btn { bottom: 20px; }
  </style>
</head>
<body>
  <div id="ui">
    <div id="name-tag">Ваше имя: Loading...</div>
    <small>Кликните по монитору, чтобы написать в чат</small>
  </div>

  <button id="smoke-btn" class="btn-action">🚬 Курить</button>
  <button id="selfie-btn" class="btn-action">📸 Селфи</button>

  <div id="input-box">
    <input type="text" id="msg-input" placeholder="Сообщение в ТГ...">
    <button id="send-btn">Отправить</button>
  </div>

  <div id="canvas-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const socket = io();
    const names = ["Дима", "Саша", "Алексей", "Егор", "Миша", "Игорь"];
    const myName = names[Math.floor(Math.random() * names.length)];
    document.getElementById('name-tag').innerText = "Рабочее место: " + myName;

    // Инициализация Three.js
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x111111, 0.05);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.2, 0); // Позиция сидя за столом

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // Освещение
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);
    const lamp = new THREE.PointLight(0xffeeaa, 1, 10);
    lamp.position.set(0, 2, -1);
    scene.add(lamp);

    // Динамическая процедурная текстура холста для CRT-монитора
    const canvasCRT = document.createElement('canvas');
    canvasCRT.width = 512; canvasCRT.height = 512;
    const ctx = canvasCRT.getContext('2d');
    const crtTexture = new THREE.CanvasTexture(canvasCRT);

    let chatLogs = ["--- CRT MONITOR v1.0 ---", "Чат подгружен..."];
    function updateCRT() {
      ctx.fillStyle = '#051305'; ctx.fillRect(0, 0, 512, 512);
      ctx.fillStyle = '#00ff00'; ctx.font = '20px monospace';
      chatLogs.slice(-15).forEach((line, i) => {
        ctx.fillText(line, 20, 30 + (i * 30));
      });
      crtTexture.needsUpdate = true;
    }
    updateCRT();

    // СОЗДАНИЕ ОФИСА И СТОЛА
    // Офисные стены
    const roomGeo = new THREE.BoxGeometry(10, 5, 10);
    const roomMat = new THREE.MeshBasicMaterial({ color: 0x222225, side: THREE.BackSide });
    scene.add(new THREE.Mesh(roomGeo, roomMat));

    // Стол
    const deskGeo = new THREE.BoxGeometry(2, 0.8, 1.2);
    const deskMat = new THREE.MeshLambertMaterial({ color: 0x5c4033 });
    const desk = new THREE.Mesh(deskGeo, deskMat);
    desk.position.set(0, 0.4, -0.8);
    scene.add(desk);

    // Старый ЭЛТ Монитор
    const monitorGeo = new THREE.BoxGeometry(0.6, 0.5, 0.5);
    const monitorMat = new THREE.MeshLambertMaterial({ color: 0xcccccc });
    const monitor = new THREE.Mesh(monitorGeo, monitorMat);
    monitor.position.set(0, 1.05, -0.9);
    scene.add(monitor);

    // Экран
    const screenGeo = new THREE.PlaneGeometry(0.5, 0.4);
    const screenMat = new THREE.MeshBasicMaterial({ map: crtTexture });
    const screen = new THREE.Mesh(screenGeo, screenMat);
    screen.position.set(0, 1.05, -0.64);
    scene.add(screen);

    // Листочек с именем
    const paperGeo = new THREE.PlaneGeometry(0.2, 0.15);
    const paperCanvas = document.createElement('canvas');
    paperCanvas.width = 256; paperCanvas.height = 128;
    const pCtx = paperCanvas.getContext('2d');
    pCtx.fillStyle = '#fff'; pCtx.fillRect(0,0,256,128);
    pCtx.fillStyle = '#000'; pCtx.font = 'bold 30px sans-serif';
    pCtx.fillText(myName, 20, 70);
    const paperTexture = new THREE.CanvasTexture(paperCanvas);
    const paperMat = new THREE.MeshBasicMaterial({ map: paperTexture });
    const paper = new THREE.Mesh(paperGeo, paperMat);
    paper.rotation.x = -Math.PI / 2;
    paper.position.set(-0.5, 0.81, -0.6);
    scene.add(paper);

    // Управление вращением камеры (ПК и Тач)
    let isDragging = false, previousMousePosition = { x: 0, y: 0 };
    const onMove = (e) => {
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      if (!isDragging || clientX === undefined) return;
      
      const deltaX = clientX - previousMousePosition.x;
      const deltaY = clientY - previousMousePosition.y;

      camera.rotation.y -= deltaX * 0.005;
      camera.rotation.x -= deltaY * 0.005;
      camera.rotation.x = Math.max(-Math.PI/4, Math.min(Math.PI/4, camera.rotation.x));

      previousMousePosition = { x: clientX, y: clientY };
    };

    window.addEventListener('mousedown', (e) => { isDragging = true; previousMousePosition = { x: e.clientX, y: e.clientY }; });
    window.addEventListener('touchstart', (e) => { isDragging = true; previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY }; });
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('touchend', () => isDragging = false);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onMove);

    // Чат и Socket.io
    socket.on('chatMessage', (msg) => {
      chatLogs.push(msg);
      updateCRT();
    });

    // Интерактив с монитором
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    window.addEventListener('click', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(screen);
      if (intersects.length > 0) {
        document.getElementById('input-box').style.display = 'block';
      }
    });

    document.getElementById('send-btn').onclick = () => {
      const input = document.getElementById('msg-input');
      if (input.value.trim() !== '') {
        socket.emit('sendToTG', { name: myName, text: input.value });
        input.value = '';
        document.getElementById('input-box').style.display = 'none';
      }
    };

    // Анимация сигареты
    let isSmoking = false;
    document.getElementById('smoke-btn').onclick = () => {
      if (isSmoking) return;
      isSmoking = true;
      let timer = 0;
      const smokeAnim = setInterval(() => {
        timer += 0.1;
        camera.position.y = 1.2 + Math.sin(timer * 4) * 0.05; // Затяжка
        if (timer > 3) {
          clearInterval(smokeAnim);
          camera.position.y = 1.2;
          isSmoking = false;
        }
      }, 50);
    };

    // Селфи
    document.getElementById('selfie-btn').onclick = () => {
      renderer.render(scene, camera);
      const imgData = renderer.domElement.toDataURL('image/png');
      socket.emit('sendSelfie', { name: myName, image: imgData });
      alert('Селфи отправлено в Telegram!');
    };

    // Ресайз окна
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
