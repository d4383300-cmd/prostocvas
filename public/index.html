<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Кинотеатр</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; user-select: none; }
    #canvas-container { width: 100%; height: 100%; display: block; }
    
    /* Прицел для ПК */
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
      margin-top: -4px; margin-left: -4px; background: rgba(255,255,255,0.7);
      border-radius: 50%; pointer-events: none; z-index: 10;
    }

    /* Модальное окно для ввода ссылки */
    #video-modal {
      display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(20,20,20,0.95); padding: 20px; border-radius: 12px; border: 1px solid #444;
      color: white; z-index: 100; text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    #video-modal input { width: 300px; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: none; font-size: 14px; }
    #video-modal button { padding: 10px 20px; background: #e50914; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }

    /* Чат UI */
    #chat-container {
      position: absolute; bottom: 20px; left: 20px; width: 320px; max-height: 200px;
      display: flex; flex-direction: column; z-index: 20; pointer-events: none;
    }
    #chat-messages { overflow-y: auto; max-height: 160px; margin-bottom: 5px; text-shadow: 1px 1px 2px black; color: #fff; font-size: 14px; }
    #chat-input-wrapper { display: flex; pointer-events: auto; }
    #chat-input { flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #333; background: rgba(0,0,0,0.6); color: white; outline: none; }
    
    /* Сенсорный интерфейс Мобильные */
    #mobile-controls { display: none; position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 15; }
    #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; pointer-events: auto; }
    #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.4); border-radius: 50%; }
    #mobile-btn-stand { position: absolute; bottom: 40px; right: 30px; width: 70px; height: 70px; background: rgba(229,9,20,0.8); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; pointer-events: auto; }

    /* Roblox-style overhead speech bubbles */
    .speech-bubble {
      position: absolute; background: rgba(255, 255, 255, 0.95); color: #000; padding: 6px 12px;
      border-radius: 12px; font-weight: bold; font-size: 13px; transform: translate(-50%, -100%);
      pointer-events: none; white-space: nowrap; box-shadow: 0px 4px 8px rgba(0,0,0,0.3); z-index: 30;
      transition: opacity 0.3s ease;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="crosshair"></div>
  <div id="canvas-container"></div>

  <!-- Модалка ввода видео -->
  <div id="video-modal">
    <h3>Введите ссылку на видео</h3>
    <p style="font-size: 12px; color: #aaa;">(YouTube MP4 direct link, Rutube, VK)</p>
    <input type="text" id="video-url" placeholder="https://...">
    <br>
    <button id="btn-load-video">Запустить проигрыватель</button>
  </div>

  <!-- Чат -->
  <div id="chat-container">
    <div id="chat-messages"></div>
    <div id="chat-input-wrapper">
      <input type="text" id="chat-input" placeholder="Нажмите Enter для отправки..." blur>
    </div>
  </div>

  <!-- Сенсорное управление -->
  <div id="mobile-controls">
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="mobile-btn-stand">Встать</div>
  </div>

  <div id="bubbles-container"></div>

  <script>
    // Инициализация Three.js Сцены
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050508);
    scene.fog = new THREE.FogExp2(0x050508, 0.03);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Свет
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);

    // Видео экран & Видео проигрыватель
    const video = document.createElement('video');
    video.crossOrigin = 'anonymous';
    video.loop = true;
    video.muted = false;

    const videoTexture = new THREE.VideoTexture(video);
    const screenGeo = new THREE.PlaneGeometry(16, 9);
    const screenMat = new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.DoubleSide });
    const screenMesh = new THREE.Mesh(screenGeo, screenMat);
    screenMesh.position.set(0, 6, -12);
    scene.add(screenMesh);

    // Модель Проектора (световой луч)
    const projectorGeo = new THREE.BoxGeometry(1, 0.8, 1.5);
    const projectorMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 });
    const projectorMesh = new THREE.Mesh(projectorGeo, projectorMat);
    projectorMesh.position.set(0, 9, 12);
    scene.add(projectorMesh);

    const spotLight = new THREE.SpotLight(0xffffff, 5);
    spotLight.position.set(0, 9, 11.5);
    spotLight.target = screenMesh;
    spotLight.angle = Math.PI / 6;
    spotLight.penumbra = 0.8;
    spotLight.castShadow = true;
    scene.add(spotLight);

    // Интерьер Кинотеатра
    // Пол и Красный Ковер
    const floorGeo = new THREE.PlaneGeometry(30, 30);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const carpetGeo = new THREE.PlaneGeometry(6, 20);
    const carpetMat = new THREE.MeshStandardMaterial({ color: 0x880011, roughness: 0.9 });
    const carpet = new THREE.Mesh(carpetGeo, carpetMat);
    carpet.rotation.x = -Math.PI / 2;
    carpet.position.set(0, 0.01, 2);
    carpet.receiveShadow = true;
    scene.add(carpet);

    // Стены & Картины
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.5 });
    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(30, 15), wallMat);
    backWall.position.set(0, 7.5, -15);
    scene.add(backWall);

    // Места/Кресла (2 ряда по 5)
    const seats = [];
    const seatGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
    const seatMat = new THREE.MeshStandardMaterial({ color: 0x441111, roughness: 0.3 });

    for (let r = 0; r < 2; r++) {
      for (let c = -2; c <= 2; c++) {
        const seat = new THREE.Mesh(seatGeo, seatMat);
        const x = c * 2.2;
        const z = 2 + r * 3;
        seat.position.set(x, 0.6, z);
        seat.castShadow = true;
        seat.receiveShadow = true;
        scene.add(seat);
        seats.push({ mesh: seat, occupied: false, pos: new THREE.Vector3(x, 1.2, z) });
      }
    }

    // Генерация Модели NPC (Детализация: Голова, Глаза, Торс, Руки, Ноги)
    function createHumanoidModel() {
      const group = new THREE.Group();
      
      const skinColors = [0xffdbac, 0xf1c27d, 0xe0ac69, 0x8d5524, 0x523318];
      const clothesColors = [0x2196f3, 0x4caf50, 0xe91e63, 0x9c27b0, 0xff9800, 0x607d8b];
      const hairColors = [0x090806, 0x2c222b, 0x716355, 0xb89778, 0xa52a2a];

      const skinMat = new THREE.MeshStandardMaterial({ color: skinColors[Math.floor(Math.random()*skinColors.length)] });
      const torsoMat = new THREE.MeshStandardMaterial({ color: clothesColors[Math.floor(Math.random()*clothesColors.length)] });
      const legsMat = new THREE.MeshStandardMaterial({ color: 0x111122 });
      const hairMat = new THREE.MeshStandardMaterial({ color: hairColors[Math.floor(Math.random()*hairColors.length)] });
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

      // Торс
      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.4), torsoMat);
      torso.position.y = 1.0;
      group.add(torso);

      // Голова & Глаза & Волосы
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), skinMat);
      head.position.y = 1.6;
      
      const eye1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.02), eyeMat);
      eye1.position.set(-0.1, 0.05, 0.21);
      const eye2 = eye1.clone();
      eye2.position.x = 0.1;
      head.add(eye1); head.add(eye2);

      const hair = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.15, 0.42), hairMat);
      hair.position.y = 0.2;
      head.add(hair);

      group.add(head);

      // Ноги
      const legLeft = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.2), legsMat);
      legLeft.position.set(-0.15, 0.3, 0);
      const legRight = legLeft.clone();
      legRight.position.x = 0.15;
      group.add(legLeft); group.add(legRight);

      // Руки
      const armLeft = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.6, 0.18), torsoMat);
      armLeft.position.set(-0.4, 1.0, 0);
      const armRight = armLeft.clone();
      armRight.position.x = 0.4;
      group.add(armLeft); group.add(armRight);

      group.castShadow = true;
      return { group, legLeft, legRight, armLeft, armRight };
    }

    // Управление Игрока & Физика Камеры
    let isSitting = false;
    let satSeat = null;
    const player = { pos: new THREE.Vector3(0, 1.6, 12), rotY: 0, rotX: 0 };
    const keys = {};

    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'KeyE') checkInteractions();
      if (e.code === 'Space' && isSitting) standUp();
      if (e.code === 'Enter') handleChatInput();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    // PointerLock (Мышь)
    container.addEventListener('click', () => {
      if (!isSitting && document.pointerLockElement !== container) {
        container.requestPointerLock();
      }
    });

    document.addEventListener('mousemove', e => {
      if (document.pointerLockElement === container) {
        player.rotY -= e.movementX * 0.002;
        player.rotX -= e.movementY * 0.002;
        player.rotX = Math.max(-Math.PI/3, Math.min(Math.PI/3, player.rotX));
      }
    });

    // Система Взаимодействия и Авто-Посадки
    function checkInteractions() {
      // Проверка дистанции до экрана
      if (player.pos.distanceTo(screenMesh.position) < 8) {
        document.exitPointerLock();
        document.getElementById('video-modal').style.display = 'block';
      }
    }

    function checkAutoSeat() {
      if (isSitting) return;
      seats.forEach(s => {
        if (!s.occupied && player.pos.distanceTo(s.pos) < 1.2) {
          isSitting = true;
          satSeat = s;
          s.occupied = true;
          document.exitPointerLock();
        }
      });
    }

    function standUp() {
      if (!isSitting) return;
      isSitting = false;
      if (satSeat) satSeat.occupied = false;
      satSeat = null;
      player.pos.y = 1.6;
      player.pos.z += 1.0;
    }

    // Загрузка Видео
    document.getElementById('btn-load-video').onclick = () => {
      const url = document.getElementById('video-url').value;
      if (url) {
        video.src = url;
        video.play().catch(e => alert("Ошибка воспроизведения. Убедитесь в поддержке CORS/Формата видео."));
        document.getElementById('video-modal').style.display = 'none';
        container.requestPointerLock();
      }
    };

    // Чат и Вывод Сообщений над Головой (Roblox Style)
    function showSpeechBubble(targetPos, text) {
      const container = document.getElementById('bubbles-container');
      const bubble = document.createElement('div');
      bubble.className = 'speech-bubble';
      bubble.innerText = text;
      container.appendChild(bubble);

      const updatePosition = () => {
        const proj = targetPos.clone().add(new THREE.Vector3(0, 2.2, 0)).project(camera);
        if (proj.z > 1) { bubble.style.opacity = '0'; return; }
        const x = (proj.x * .5 + .5) * window.innerWidth;
        const y = (-(proj.y * .5) + .5) * window.innerHeight;
        bubble.style.left = `${x}px`;
        bubble.style.top = `${y}px`;
        bubble.style.opacity = '1';
      };

      const timer = setInterval(updatePosition, 16);
      setTimeout(() => { clearInterval(timer); bubble.remove(); }, 4000);
    }

    function handleChatInput() {
      const input = document.getElementById('chat-input');
      if (document.activeElement !== input) {
        input.focus();
      } else {
        const msg = input.value.trim();
        if (msg) {
          addChatMessage("Вы", msg);
          showSpeechBubble(player.pos, msg);
          
          // Механика Попкорна
          if (msg.toLowerCase() === 'попкорн') {
            spawnPopcorn();
          }
          input.value = '';
        }
        input.blur();
        container.requestPointerLock();
      }
    }

    function addChatMessage(author, text) {
      const chat = document.getElementById('chat-messages');
      const el = document.createElement('div');
      el.innerHTML = `<b>${author}:</b> ${text}`;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    // Предмет: Попкорн
    let popcornMesh = null;
    function spawnPopcorn() {
      if (popcornMesh) scene.remove(popcornMesh);
      const popGeo = new THREE.CylinderGeometry(0.2, 0.15, 0.4);
      const popMat = new THREE.MeshStandardMaterial({ color: 0xee1111 });
      popcornMesh = new THREE.Mesh(popGeo, popMat);
      scene.add(popcornMesh);

      setTimeout(() => {
        if (popcornMesh) { scene.remove(popcornMesh); popcornMesh = null; }
      }, 5000);
    }

    // Управление NPC Спавном и Реакциями
    const npcs = [];
    function spawnNPC(seat) {
      const npcModel = createHumanoidModel();
      npcModel.group.position.copy(seat.pos);
      npcModel.group.position.y = 0.8; // Сидит
      scene.add(npcModel.group);
      seat.occupied = true;
      
      const npcData = { model: npcModel, seat: seat, timeToLeave: Date.now() + Math.random()*30000 + 20000 };
      npcs.push(npcData);
    }

    // Начальный спавн 4 NPC
    seats.slice(0, 4).forEach(s => spawnNPC(s));

    // Цикл Реакций NPC
    setInterval(() => {
      if (npcs.length === 0) return;
      const randomNpc = npcs[Math.floor(Math.random() * npcs.length)];
      const emojis = ["👍", "👎", "😱", "🔥", "💩", "❤️", "Фу!", "Круто!"];
      const reaction = emojis[Math.floor(Math.random() * emojis.length)];
      showSpeechBubble(randomNpc.model.group.position, reaction);
    }, 4000);

    // Главный Рендер/Физический Цикл
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      // Движение игрока WASD
      if (!isSitting) {
        const speed = 4.0 * delta;
        const dir = new THREE.Vector3();
        if (keys['KeyW']) dir.z -= 1;
        if (keys['KeyS']) dir.z += 1;
        if (keys['KeyA']) dir.x -= 1;
        if (keys['KeyD']) dir.x += 1;

        dir.normalize();
        dir.applyAxisAngle(new THREE.Vector3(0,1,0), player.rotY);
        player.pos.addScaledVector(dir, speed);

        checkAutoSeat();
      } else if (satSeat) {
        player.pos.copy(satSeat.pos);
        player.pos.y = 1.6;
      }

      // Обновление положения попкорна в руках
      if (popcornMesh) {
        popcornMesh.position.copy(player.pos).add(new THREE.Vector3(0.2, -0.3, -0.5).applyAxisAngle(new THREE.Vector3(0,1,0), player.rotY));
      }

      // Ротация и Позиционирование Камеры
      camera.position.copy(player.pos);
      camera.rotation.set(0,0,0);
      camera.rotation.y = player.rotY;
      camera.rotation.x = player.rotX;

      // Обновление ротации NPC ротации и их уход
      const now = Date.now();
      npcs.forEach((npc, idx) => {
        if (now > npc.timeToLeave) {
          scene.remove(npc.model.group);
          npc.seat.occupied = false;
          npcs.splice(idx, 1);
          
          // Спавним нового NPC через время
          setTimeout(() => {
            const freeSeat = seats.find(s => !s.occupied);
            if (freeSeat) spawnNPC(freeSeat);
          }, 3000);
        }
      });

      renderer.render(scene, camera);
    }

    animate();

    // Адаптивность окна
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
