<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прослушка — Чат и Мониторинг</title>
  <!-- Three.js для 3D режимов -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }

    /* Боковая панель Прослушки */
    #sidebar { width: 320px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 20px; gap: 15px; }
    #sidebar h2 { font-size: 1.2rem; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
    
    .status-badge { display: inline-block; width: 10px; height: 10px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; }
    
    .control-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 0.85rem; color: #94a3b8; }
    input[type="text"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; }
    
    /* Кнопки Прослушки */
    .btn { padding: 12px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: center; }
    .btn-primary { background: #0284c7; color: #fff; }
    .btn-primary:hover { background: #0369a1; }
    
    /* Специальная кнопка 3D GAME (Только для ПК) */
    #btn-3d-game { background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; display: none; box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3); }
    #btn-3d-game:hover { opacity: 0.9; transform: translateY(-1px); }

    /* Показываем 3D кнопку только на ПК устройствах */
    @media (pointer: fine) and (min-width: 768px) {
      #btn-3d-game { display: block; }
    }

    /* Основная область чата */
    #main-chat { flex: 1; display: flex; flex-direction: column; background: #0f172a; }
    #messages-list { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    
    .message-card { background: #1e293b; padding: 12px 16px; border-radius: 8px; border-left: 4px solid #38bdf8; max-width: 85%; }
    .message-card .meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: #64748b; margin-bottom: 4px; }
    .message-card .author { font-weight: bold; color: #38bdf8; }
    .message-card .text { color: #e2e8f0; word-break: break-word; }

    #input-bar { padding: 15px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 10px; }

    /* 3D Оверлей */
    #game-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 99999; display: none; background: #000; }
    #canvas3d { width: 100%; height: 100%; display: block; }
    #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    
    #hud-info { position: absolute; top: 20px; left: 20px; background: rgba(15, 23, 42, 0.85); border: 1px solid #38bdf8; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; color: #38bdf8; pointer-events: none; }
    #hud-input-box { position: absolute; top: 20px; left: 20px; display: none; background: rgba(15, 23, 42, 0.95); padding: 12px; border-radius: 8px; border: 2px solid #a855f7; width: 350px; z-index: 100000; }
    #hud-input-box input { width: 100%; padding: 8px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 4px; outline: none; }

    #exit-3d-btn { position: absolute; top: 20px; right: 20px; background: #ef4444; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Меню Прослушки -->
  <div id="sidebar">
    <h2><span class="status-badge"></span> Прослушка v3.0</h2>
    
    <div class="control-group">
      <label for="user-nick">Ваш Никнейм:</label>
      <input type="text" id="user-nick" placeholder="Агент_007">
    </div>

    <!-- Кнопка перехода в 3D (Только ПК) -->
    <button class="btn" id="btn-3d-game" onclick="launch3DMode()">🎮 3D GAME (КЛАСС)</button>
  </div>

  <!-- Чат Прослушки -->
  <div id="main-chat">
    <div id="messages-list"></div>
    <div id="input-bar">
      <input type="text" id="chat-msg" placeholder="Введите сообщение...">
      <button class="btn btn-primary" onclick="sendMessage()">Отправить</button>
    </div>
  </div>

  <!-- 3D Режим Игра -->
  <div id="game-overlay">
    <div id="crosshair"></div>
    <div id="hud-info">
      Управление: Мышь - обзор (клик для захвата)<br>
      Нажмите [E] или [T] — открыть чат<br>
      [ESC] — освободить курсор
    </div>
    <div id="hud-input-box">
      <input type="text" id="hud-text" placeholder="Введите сообщение в класс..." maxlength="80">
    </div>
    <button id="exit-3d-btn" onclick="close3DMode()">Выйти из 3D</button>
    <canvas id="canvas3d"></canvas>
  </div>

<script>
  let socket;
  let myNick = "Агент_" + Math.floor(Math.random() * 899 + 100);
  document.getElementById('user-nick').value = myNick;

  function connectWS() {
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    socket = new WebSocket(`${protocol}//${window.location.host}`);

    socket.onmessage = (event) => {
      const data = JSON.parse(event.data);
      
      if (data.type === 'chat') {
        appendMessage(data.nick, data.text, data.time);
        if (typeof update3DBoard === 'function') update3DBoard(data.nick, data.text);
      } else if (data.type === 'players_sync') {
        if (typeof updateOtherPlayers === 'function') updateOtherPlayers(data.players);
      } else if (data.type === 'assigned_seat') {
        mySeat = data.seat;
        setCameraSeat(mySeat);
      } else if (data.type === 'room_full') {
        alert("В 3D-классе заняты все 8 мест!");
        close3DMode();
      } else if (data.type === 'request_photo') {
        sendCameraPhoto();
      }
    };
  }
  connectWS();

  function appendMessage(nick, text, time) {
    const container = document.getElementById('messages-list');
    const card = document.createElement('div');
    card.className = 'message-card';
    card.innerHTML = `
      <div class="meta">
        <span class="author">${escapeHtml(nick)}</span>
        <span>${time || new Date().toLocaleTimeString()}</span>
      </div>
      <div class="text">${escapeHtml(text)}</div>
    `;
    container.appendChild(card);
    container.scrollTop = container.scrollHeight;
  }

  function sendMessage(customText = null) {
    const input = document.getElementById('chat-msg');
    myNick = document.getElementById('user-nick').value.trim() || myNick;
    const text = customText || input.value.trim();

    if (text && socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({ type: 'chat', nick: myNick, text: text }));
      if (!customText) input.value = '';
    }
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  /* ================= 3D ДВИЖОК ТРЕХМЕРНОГО КЛАССА ================= */
  let scene3d, camera3d, renderer3d;
  let isLocked = false;
  let rotX = 0, rotY = 0;
  let mySeat = -1;
  let otherAvatarMeshes = {};
  let boardCanvas, boardCtx, boardTexture;

  const DESK_SEATS = [
    { x: -2.5, z: -1.5 }, { x: 2.5, z: -1.5 },
    { x: -2.5, z:  1.5 }, { x: 2.5, z:  1.5 },
    { x: -2.5, z:  4.5 }, { x: 2.5, z:  4.5 },
    { x: -2.5, z:  7.5 }, { x: 2.5, z:  7.5 }
  ];

  function init3DScene() {
    const canvas = document.getElementById('canvas3d');
    scene3d = new THREE.Scene();
    scene3d.background = new THREE.Color(0x0f172a);

    camera3d = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    renderer3d = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, preserveDrawingBuffer: true });
    renderer3d.setSize(window.innerWidth, window.innerHeight);

    // Свет
    scene3d.add(new THREE.AmbientLight(0xffffff, 0.7));
    const pointLight = new THREE.PointLight(0xffffff, 0.5);
    pointLight.position.set(0, 5, 0);
    scene3d.add(pointLight);

    // Стены класса
    const roomGeo = new THREE.BoxGeometry(12, 6, 18);
    const roomMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, side: THREE.BackSide });
    const roomMesh = new THREE.Mesh(roomGeo, roomMat);
    roomMesh.position.set(0, 3, 3);
    scene3d.add(roomMesh);

    // Доска
    boardCanvas = document.createElement('canvas');
    boardCanvas.width = 1024;
    boardCanvas.height = 512;
    boardCtx = boardCanvas.getContext('2d');
    boardTexture = new THREE.CanvasTexture(boardCanvas);
    update3DBoard("ПРОСЛУШКА", "Добро пожаловать в 3D Класс!");

    const boardMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(8, 3.5),
      new THREE.MeshBasicMaterial({ map: boardTexture })
    );
    boardMesh.position.set(0, 3.5, -5.9);
    scene3d.add(boardMesh);

    // 8 Парт и Стульев
    DESK_SEATS.forEach(s => {
      const desk = new THREE.Mesh(new THREE.BoxGeometry(2, 1.2, 1), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
      desk.position.set(s.x, 0.6, s.z - 0.4);
      scene3d.add(desk);

      const chair = new THREE.Mesh(new THREE.BoxGeometry(1, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: 0x4a2e18 }));
      chair.position.set(s.x, 0.4, s.z);
      scene3d.add(chair);
    });

    canvas.addEventListener('click', () => {
      if (!isHudOpen) canvas.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      isLocked = (document.pointerLockElement === canvas);
    });

    document.addEventListener('mousemove', (e) => {
      if (!isLocked) return;
      rotY -= e.movementX * 0.002;
      rotX -= e.movementY * 0.002;
      rotX = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, rotX));

      camera3d.rotation.order = "YXZ";
      camera3d.rotation.y = rotY;
      camera3d.rotation.x = rotX;

      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: 'look', rotY: rotY, rotX: rotX }));
      }
    });

    renderLoop();
  }

  function update3DBoard(nick, text) {
    if (!boardCtx) return;
    boardCtx.fillStyle = '#064e3b';
    boardCtx.fillRect(0, 0, 1024, 512);
    boardCtx.strokeStyle = '#78350f';
    boardCtx.lineWidth = 16;
    boardCtx.strokeRect(0, 0, 1024, 512);

    boardCtx.fillStyle = '#f8fafc';
    boardCtx.font = 'bold 36px monospace';
    boardCtx.fillText(`${nick}:`, 50, 90);

    boardCtx.font = '32px sans-serif';
    boardCtx.fillText(text.substring(0, 45), 50, 160);
    if (text.length > 45) boardCtx.fillText(text.substring(45, 90), 50, 210);

    boardTexture.needsUpdate = true;
  }

  function createFunnyModel() {
    const group = new THREE.Group();
    // Голова
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true }));
    head.position.y = 1.3;
    group.add(head);
    // Глаза
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
    const e1 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), eyeMat);
    e1.position.set(-0.12, 1.35, -0.28);
    const e2 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), eyeMat);
    e2.position.set(0.12, 1.35, -0.28);
    group.add(e1, e2);
    // Скелет
    const spine = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.8), new THREE.MeshBasicMaterial({ color: 0x94a3b8 }));
    spine.position.y = 0.7;
    group.add(spine);
    return group;
  }

  function updateOtherPlayers(players) {
    Object.keys(otherAvatarMeshes).forEach(id => {
      if (!players[id]) {
        scene3d.remove(otherAvatarMeshes[id]);
        delete otherAvatarMeshes[id];
      }
    });

    Object.keys(players).forEach(id => {
      if (id === socket.id) return;
      const p = players[id];
      if (!otherAvatarMeshes[id]) {
        const mesh = createFunnyModel();
        const s = DESK_SEATS[p.seat];
        mesh.position.set(s.x, 0, s.z);
        scene3d.add(mesh);
        otherAvatarMeshes[id] = mesh;
      }
      const avatar = otherAvatarMeshes[id];
      avatar.children[0].rotation.y = p.rotY || 0;
      avatar.children[0].rotation.x = p.rotX || 0;
    });
  }

  function setCameraSeat(seatIdx) {
    if (seatIdx < 0 || seatIdx >= DESK_SEATS.length) return;
    const s = DESK_SEATS[seatIdx];
    camera3d.position.set(s.x, 1.3, s.z);
  }

  function sendCameraPhoto() {
    if (!renderer3d || !scene3d) return;
    const oldPos = camera3d.position.clone();
    const oldRot = camera3d.rotation.clone();

    // Переключаемся на ракурс камеры наблюдения под потолком
    camera3d.position.set(5.5, 5.5, -5.5);
    camera3d.lookAt(0, 1, 2);
    renderer3d.render(scene3d, camera3d);

    const base64Photo = renderer3d.domElement.toDataURL('image/jpeg', 0.5);

    camera3d.position.copy(oldPos);
    camera3d.rotation.copy(oldRot);

    if (socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({ type: 'camera_snapshot', image: base64Photo }));
    }
  }

  function launch3DMode() {
    myNick = document.getElementById('user-nick').value.trim() || myNick;
    document.getElementById('game-overlay').style.display = 'block';
    if (!scene3d) init3DScene();
    if (socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({ type: 'enter_3d', nick: myNick }));
    }
  }

  function close3DMode() {
    document.getElementById('game-overlay').style.display = 'none';
    if (document.pointerLockElement) document.exitPointerLock();
    if (socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({ type: 'exit_3d' }));
    }
  }

  // Набор в 3D чате на [E] и [T]
  let isHudOpen = false;
  document.addEventListener('keydown', (e) => {
    if (document.getElementById('game-overlay').style.display !== 'block') return;
    const k = e.key.toLowerCase();
    
    if (!isHudOpen && (k === 'e' || k === 't' || k === 'у' || k === 'е')) {
      e.preventDefault();
      isHudOpen = true;
      document.getElementById('hud-input-box').style.display = 'block';
      document.getElementById('hud-text').value = '';
      document.getElementById('hud-text').focus();
      if (document.pointerLockElement) document.exitPointerLock();
    } else if (isHudOpen && e.key === 'Enter') {
      const val = document.getElementById('hud-text').value.trim();
      if (val) sendMessage(val);
      isHudOpen = false;
      document.getElementById('hud-input-box').style.display = 'none';
      document.getElementById('canvas3d').requestPointerLock();
    } else if (isHudOpen && e.key === 'Escape') {
      isHudOpen = false;
      document.getElementById('hud-input-box').style.display = 'none';
      document.getElementById('canvas3d').requestPointerLock();
    }
  });

  function renderLoop() {
    requestAnimationFrame(renderLoop);
    if (renderer3d && scene3d && camera3d) {
      renderer3d.render(scene3d, camera3d);
    }
  }
</script>
</body>
</html>
