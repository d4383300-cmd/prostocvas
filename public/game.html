<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Харест - 3D Рулетка</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top:0; left:0; z-index: 1; }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.98); color: #ff3333; display: flex;
            justify-content: center; align-items: center; font-size: 28px;
            z-index: 999; text-align: center; padding: 20px; font-weight: bold;
            letter-spacing: 2px;
        }

        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 20px;
        }

        .status-box {
            background: rgba(0,0,0,0.75); border: 1px solid #ff2222; color: #fff;
            padding: 15px 25px; border-radius: 4px; text-align: center;
            align-self: center; font-size: 20px; text-shadow: 0 0 5px #ff0000;
        }

        .hp-bar { display: flex; justify-content: space-between; width: 100%; font-size: 18px; color: #fff; }
        .hp-val { color: #ff3333; font-weight: bold; }

        #controls {
            align-self: center; display: none; gap: 20px; pointer-events: auto; margin-bottom: 20px;
        }

        .btn-action {
            background: #1a0000; border: 2px solid #ff2222; color: #fff;
            padding: 16px 32px; font-size: 18px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 15px rgba(255,0,0,0.4); transition: 0.2s;
        }
        .btn-action:hover { background: #ff2222; color: #000; box-shadow: 0 0 25px #ff0000; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="overlay">ПРОВЕРКА ДОСТУПА И ПОДКЛЮЧЕНИЕ...</div>

    <div id="hud">
        <div class="hp-bar">
            <div>ВЫ: <span id="my-hp" class="hp-val">♥♥♥</span></div>
            <div>ОППОНЕНТ: <span id="enemy-hp" class="hp-val">♥♥♥</span></div>
        </div>
        <div id="status" class="status-box">ОЖИДАНИЕ ИГРОКОВ...</div>
        <div id="controls">
            <button class="btn-action" onclick="shoot('self')">🎯 В СЕБЯ</button>
            <button class="btn-action" onclick="shoot('enemy')">💀 В НЕГО</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const duelId = urlParams.get('duel');

        let scene, camera, renderer, shotgunGroup, tableMesh, corpseMesh;
        let myHp = 3, enemyHp = 3;
        let ammo = []; //Массив патронов: true - боевой, false - холостой
        let isMyTurn = true;
        let myRole = 'p1';

        const overlay = document.getElementById('overlay');
        const statusBox = document.getElementById('status');
        const controls = document.getElementById('controls');

        async function checkAccess() {
            try {
                const res = await fetch(`/api/check-access?duelId=${duelId}`);
                const data = await res.json();
                if (!data.allowed) {
                    overlay.innerText = data.reason || "Простите, вы не участвуете в игре.";
                } else {
                    overlay.style.display = 'none';
                    myRole = data.role;
                    initGame();
                }
            } catch (e) {
                overlay.innerText = "Ошибка сервера.";
            }
        }

        function initGame() {
            // Инициализация трехмерной сцены
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x080808, 0.08);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.4, 1.8);

            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Освещение
            const spotLight = new THREE.SpotLight(0xffaaaa, 2);
            spotLight.position.set(0, 3, 0);
            spotLight.castShadow = true;
            scene.add(spotLight);
            scene.add(new THREE.AmbientLight(0x111111));

            // Стол
            const tableGeo = new THREE.BoxGeometry(2, 0.1, 3);
            const tableMat = new THREE.MeshStandardMaterial({ color: 0x1a0f0a, roughness: 0.8 });
            tableMesh = new THREE.Mesh(tableGeo, tableMat);
            tableMesh.position.set(0, 0.5, 0);
            scene.add(tableMesh);

            // Дробовик
            shotgunGroup = createShotgun();
            shotgunGroup.position.set(0.2, 0.7, 0.8);
            scene.add(shotgunGroup);

            window.addEventListener('resize', onResize);
            animate();
            startRound();
        }

        function createShotgun() {
            const group = new THREE.Group();
            const metalMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.9, roughness: 0.2 });
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x3d1e0d, roughness: 0.6 });

            // Ствол
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.9, 16), metalMat);
            barrel.rotation.x = Math.PI / 2;
            group.add(barrel);

            // Ложе
            const stock = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.1, 0.4), woodMat);
            stock.position.set(0, -0.05, 0.4);
            group.add(stock);

            return group;
        }

        function startRound() {
            // Генерация патронов
            const live = Math.floor(Math.random() * 2) + 1;
            const blank = Math.floor(Math.random() * 2) + 1;
            ammo = Array(live).fill(true).concat(Array(blank).fill(false));
            ammo.sort(() => Math.random() - 0.5);

            statusBox.innerText = `ПОДГОТОВКА: 3`;
            let timer = 3;
            const interval = setInterval(() => {
                timer--;
                if (timer > 0) {
                    statusBox.innerText = `ПОДГОТОВКА: ${timer}`;
                } else {
                    clearInterval(interval);
                    statusBox.innerText = `ЗАРЯЖЕНО: ${live} БОЕВЫХ | ${blank} ХОЛОСТЫХ`;
                    setTimeout(() => {
                        nextTurn();
                    }, 2500);
                }
            }, 1000);
        }

        function nextTurn() {
            if (ammo.length === 0) {
                startRound();
                return;
            }
            if (isMyTurn) {
                statusBox.innerText = "ВАШ ХОД! ВЫБЕРИТЕ ЦЕЛЬ";
                controls.style.display = 'flex';
            } else {
                statusBox.innerText = "ХОД ОППОНЕНТА...";
                controls.style.display = 'none';
                setTimeout(opponentSimulateTurn, 2000);
            }
        }

        function shoot(target) {
            controls.style.display = 'none';
            const isLive = ammo.pop();

            // Анимация отдачи
            shotgunGroup.position.z += 0.15;
            shotgunGroup.rotation.x -= 0.2;
            setTimeout(() => {
                shotgunGroup.position.z -= 0.15;
                shotgunGroup.rotation.x += 0.2;
            }, 150);

            if (target === 'self') {
                if (isLive) {
                    myHp--;
                    updateHpUI();
                    statusBox.innerText = "ВЫСТРЕЛ! БОЕВОЙ! ВЫ ПОЛУЧИЛИ УРОН!";
                    isMyTurn = false;
                } else {
                    statusBox.innerText = "КЛИК! ХОЛОСТОЙ! ХОД ОСТАЕТСЯ У ВАС!";
                }
            } else {
                if (isLive) {
                    enemyHp--;
                    updateHpUI();
                    statusBox.innerText = "ВЫСТРЕЛ! БОЕВОЙ! ОППОНЕНТ ПОЛУЧИЛ УРОН!";
                } else {
                    statusBox.innerText = "КЛИК! ХОЛОСТОЙ!";
                }
                isMyTurn = false;
            }

            if (checkEndGame()) return;
            setTimeout(nextTurn, 2000);
        }

        function opponentSimulateTurn() {
            const isLive = ammo.pop();
            const target = Math.random() > 0.5 ? 'self' : 'enemy';

            if (target === 'self') {
                if (isLive) {
                    enemyHp--;
                    updateHpUI();
                    statusBox.innerText = "ОППОНЕНТ ВЫСТРЕЛИЛ В СЕБЯ БОЕВЫМ!";
                    isMyTurn = true;
                } else {
                    statusBox.innerText = "У ОППОНЕНТА ХОЛОСТОЙ! ЕГО ХОД СНОВА.";
                }
            } else {
                if (isLive) {
                    myHp--;
                    updateHpUI();
                    statusBox.innerText = "ОППОНЕНТ ПОПАЛ В ВАС БОЕВЫМ!";
                } else {
                    statusBox.innerText = "ОППОНЕНТ ПРОМАХНУЛСЯ (ХОЛОСТОЙ)!";
                }
                isMyTurn = true;
            }

            if (checkEndGame()) return;
            setTimeout(nextTurn, 2000);
        }

        function updateHpUI() {
            document.getElementById('my-hp').innerText = "♥".repeat(Math.max(0, myHp));
            document.getElementById('enemy-hp').innerText = "♥".repeat(Math.max(0, enemyHp));
        }

        function checkEndGame() {
            if (myHp <= 0 || enemyHp <= 0) {
                const iWon = myHp > 0;
                statusBox.innerText = iWon ? "ВЫ ПОБЕДИЛИ!" : "ВЫ МЕРТВЫ!";
                renderDeathScene(iWon);
                return true;
            }
            return false;
        }

        function renderDeathScene(iWon) {
            // Позиционирование камеры для генерации финального кадра
            camera.position.set(0, 1.2, 0);
            camera.lookAt(0, 0.5, -1);

            // Генерация сцены поражения
            const bodyGeo = new THREE.BoxGeometry(0.5, 0.2, 1.2);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x550000 });
            corpseMesh = new THREE.Mesh(bodyGeo, bodyMat);
            corpseMesh.position.set(0, 0.6, -1);
            scene.add(corpseMesh);

            renderer.render(scene, camera);

            // Отправка кадра в Telegram
            const imgData = renderer.domElement.toDataURL('image/png');
            fetch('/api/finish-game', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    winnerId: iWon ? myRole : 'bot',
                    loserId: iWon ? 'bot' : myRole,
                    imageBase64: imgData
                })
            });
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        checkAccess();
    </script>
</body>
</html>
